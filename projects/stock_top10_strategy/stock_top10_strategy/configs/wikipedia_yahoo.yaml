run_name: top10_wikipedia_yahoo_2000_current

data:
  path: stock_top10_strategy/data/top10_wikipedia_yahoo_2000_current.csv
  source_label: Wikipedia ranking snapshots + Yahoo Finance prices
  source_kind: public_rankings_proxy
  min_members_per_date: 6
  start_date: "2000-01-01"
  end_date: null

strategy:
  initial_cash: 1000000.0
  buy_notional: 25000.0
  trigger_return: 0.03
  trigger_lookback_days: 5
  top_n: 10
  rebalance_frequency: daily
  exit_ween_days: 10

execution:
  commission_bps: 1.0
  min_commission: 1.0
  half_spread_bps: 2.0
  slippage_bps: 3.0

risk:
  max_position_pct_nav: 0.20
  max_single_day_turnover_pct_nav: 0.25
  allow_margin: false
  allow_fractional_shares: false
  risk_free_rate: 0.0

reporting:
  output_dir: stock_top10_strategy/runs
