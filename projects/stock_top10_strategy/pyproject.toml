[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-top10-strategy"
version = "0.1.0"
description = "Point-in-time top-10 global equity buy-the-move backtester"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "yfinance>=1.4",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
stock-top10-strategy = "stock_top10_strategy.__main__:main"

[tool.setuptools.packages.find]
include = ["stock_top10_strategy*"]
namespaces = false

[tool.setuptools.package-data]
stock_top10_strategy = ["configs/*.yaml", "configs/*.csv", "examples/*.csv"]
